path_prefix: &path_prefix ""

pipeline:
  proxy_dataset: rollout
  policy_dataset: h5

problem:
  relevant_len: 1
  noise_len: 1
  target_blank_len: 1
  action_dim: 9
  buffer_size: &buffer_size 2
  num_symbols: &num_symbols 8
  noise_symbols: &noise_symbols 8
  scatter_source: True
  scatter_target: True
  num_variations: 1000
  randomize_reset: True

test_problem_override:
  # effective seq_len = 2 * relevant_len + noise_len + target_blank_len
  noise_len: 100
  target_blank_len: 100
  num_variations: 100

policy_problem_override:
  # effective seq_len = 2 * relevant_len + noise_len + target_blank_len
  relevant_len: 10
  noise_len: 10
  target_blank_len: 10
  buffer_size: 20 # 2 * relevant_len
  num_variations: 10000

selector_env:
  n_envs: 4
  action_penalty: 0.0
  min_loss: 0.001
  reward_scaling_tau: 0.2

selector:
  total_timesteps: 200000
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  learning_rate: 0.0003
  features_extractor_kwargs:
    num_symbols: *num_symbols
    noise_symbols: *noise_symbols
    features_dim: 32

proxy:
  batch_size: 256
  learning_rate: 0.001
  rollout_multiplier: 30
  training_epochs: 10
  save_interval: 10
  cache_path: ""
  model_kwargs:
    total_slots: *buffer_size
    num_symbols: *num_symbols
    noise_symbols: *noise_symbols
    embd_dim: 32
    hidden_dim: 256

policy:
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.0
  training_steps: 50000
  save_interval: 10000
  balance_sampler: True
  cache_path: ""
  model_kwargs:
    total_slots: 21 # 2 * relevant_len + current obs
    num_symbols: *num_symbols
    noise_symbols: *noise_symbols
    embd_dim: 32
    hidden_dim: 64
    num_layers: 4

evaluator:
  loss_threshold: 0.1
  evaluation_rollouts: 10
  path_prefix: *path_prefix

policy_evaluator:
  sr_threshold: 0.99
  logging: False
  evaluation_rollouts: 10
